name: Linters
on:
  pull_request:
    branches:
      - master
  issue_comment:
      types:
        - created
permissions:
  statuses: write
  contents: read
jobs:
  lint:
    name: reviewdog
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      BUNDLE_ONLY: rubocop
    steps:
      - uses: actions/checkout@v3

      # - uses: actions/setup-node@v3
      #   with:
      #     node-version-file: .node-version
      # - name: Install JS dependencies
      #   run: yarn install --frozen-lockfile

      # - uses: ruby/setup-ruby@v1
      #   with:
      #     bundler-cache: true # runs 'bundle install' and caches installed gems automatically

      # - run: git show --no-patch # the commit being tested (which is often a merge due to actions/checkout@v3)

      # - uses: reviewdog/action-setup@v1
      #   with:
      #     reviewdog_version: v0.21.0

      # - id: run-rd
      #   run: ./script/reviewdog.sh
      #   continue-on-error: true
      #   env:
      #     REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.github_token }}

                 
                
      - uses: ruby/setup-ruby@1a615958ad9d422dd932dc1d5823942ee002799f # v1.227.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - id: rubocop
        uses: reviewdog/action-rubocop@fcb74ba274da10b18d038d0bcddaae3518739634 # v2.21.2
        with:
          reporter: github-pr-review # Default is github-pr-check
          skip_install: true
          use_bundler: true
          rubocop_version: Gemfile
      - id: shfmt
        uses: reviewdog/action-shfmt@d8f080930b9be5847b4f97e9f4122b81a82aaeac 
      - id: brakeman
        uses: reviewdog/action-brakeman@5083efd49634e26645a0736681b618ccc3fb7f14 # v2.19.2
        with:
          brakeman_version: 4.8.2
          reporter: github-pr-review # Default is github-pr-check

      - name: create-success-status
        if: ${{ steps.rubocop.outcome == 'success' && steps.shfmt.outcome == 'success' && steps.brakeman.outcome == 'success' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.pull_request.head.sha }}',
              state: 'success',
              context: 'Check Linters',
              description: 'Linter checks passed',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
      - name: create-failure-status
        if: ${{ steps.rubocop.outcome == 'failure' || steps.shfmt.outcome == 'failure' || steps.brakeman.outcome == 'failure' }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ github.event.pull_request.head.sha }}',
              state: 'failure',
              context: 'Check Linters',
              description: 'Linter checks failed - Please review and Fix/Approve',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

  approve:
    name: Manual Approval
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'linters approve')
    permissions:
      statuses: write
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Check approval comment
        id: check-approval
        run: |
          echo "🔍 DEBUG: Processing linters approval comment"
          echo "🔍 DEBUG: Comment body: '${{ github.event.comment.body }}'"
          echo "🔍 DEBUG: Comment user: ${{ github.event.comment.user.login }}"

          # Get PR details to find the head SHA
          PR_URL="${{ github.event.issue.pull_request.url }}"
          echo "🔍 DEBUG: Fetching PR data from: ${PR_URL}"

          PR_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                         -H "Accept: application/vnd.github.v3+json" \
                         "${PR_URL}")

          # Extract PR head SHA
          PR_HEAD_SHA=$(echo "${PR_DATA}" | grep -A 10 '"head"' | grep '"sha"' | head -n 1 | sed 's/.*"sha": *"\([^"]*\)".*/\1/')
          COMMENT_USER="${{ github.event.comment.user.login }}"

          echo "🔍 DEBUG: PR Head SHA: ${PR_HEAD_SHA}"
          echo "🔍 DEBUG: Comment User: ${COMMENT_USER}"

          echo "✅ Processing approval"
          echo "pr_head_sha=${PR_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "approver=${COMMENT_USER}" >> "$GITHUB_OUTPUT"

      - name: Create success status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.check-approval.outputs.pr_head_sha }}',
              state: 'success',
              context: 'Check Linters',
              description: 'Linters manually approved by @${{ steps.check-approval.outputs.approver }}',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });

      - name: Add reaction to approval comment
        run: |
          echo "🔍 DEBUG: Adding rocket reaction to comment"
          REACTION_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -d '{"content": "rocket"}')

          echo "🔍 DEBUG: Reaction API response:"
          echo "${REACTION_RESPONSE}"

          if echo "${REACTION_RESPONSE}" | grep -q '"content":"rocket"'; then
            echo "✅ Successfully added rocket reaction!"
          else
            echo "❌ Failed to add rocket reaction"
          fi
